<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보건대행기관 업무실적 결과보고서 생성기</title>
  <style>
    :root { --bg:#f5f7fb; --panel:#fff; --ink:#162033; --muted:#667085; --line:#d8dee9; --primary:#155eef; --primary-dark:#0f45b8; --warn:#b54708; --ok:#067647; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    header { background:linear-gradient(135deg,#17324d 0%,#155eef 100%); color:white; padding:34px 28px; }
    header .wrap, main { max-width:1280px; margin:0 auto; }
    h1 { margin:0 0 10px; font-size:30px; letter-spacing:0; }
    header p { max-width:900px; margin:0; line-height:1.6; color:#e5edff; }
    main { padding:24px; }
    .toolbar { display:grid; grid-template-columns:minmax(280px,1fr) auto; gap:16px; align-items:stretch; margin-bottom:20px; }
    .upload { border:1px dashed #98a2b3; background:var(--panel); border-radius:8px; padding:18px; min-height:118px; display:flex; flex-direction:column; justify-content:center; gap:10px; }
    .upload strong { font-size:17px; }
    input[type=file] { width:100%; }
    button { border:0; border-radius:8px; background:var(--primary); color:white; font-weight:700; padding:0 22px; min-height:52px; cursor:pointer; font-size:15px; }
    button:hover { background:var(--primary-dark); }
    button:disabled { opacity:.55; cursor:wait; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
    .metric { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:15px; }
    .metric span { color:var(--muted); font-size:13px; }
    .metric b { display:block; font-size:26px; margin-top:5px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .panel-head h2 { font-size:18px; margin:0; }
    .secondary { min-height:38px; padding:0 14px; background:#344054; }
    .table-wrap { overflow:auto; max-height:58vh; }
    table { width:100%; border-collapse:collapse; min-width:1120px; }
    th, td { border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top; font-size:13px; }
    th { position:sticky; top:0; background:#f8fafc; z-index:1; white-space:nowrap; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    .empty { padding:46px 20px; text-align:center; color:var(--muted); }
    .notice { margin:14px 0; padding:12px 14px; border-radius:8px; border:1px solid #fedf89; background:#fffaeb; color:var(--warn); display:none; white-space:pre-wrap; }
    .ok { color:var(--ok); font-weight:700; }
    @media (max-width:800px) {
      header{padding:26px 18px;} main{padding:16px;} .toolbar{grid-template-columns:1fr;}
      .summary{grid-template-columns:repeat(2,minmax(0,1fr));} button{width:100%;}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>보건대행기관 업무실적 결과보고서 생성기</h1>
      <p>PDF 방문보고서를 여러 개 올리면 의사, 산업위생관리기사, 간호사 방문건수와 상담인원, 측정 결과, 조치사항, 홍보물 배포 내용을 추출해 결과보고서 문서로 만듭니다.</p>
    </div>
  </header>
  <main>
    <section class="toolbar">
      <label class="upload">
        <strong>PDF 파일만 선택</strong>
        <span>여러 PDF를 한 번에 선택할 수 있습니다. 스캔본 PDF는 텍스트 추출이 안 될 수 있습니다.</span>
        <input id="files" type="file" multiple accept=".pdf,application/pdf">
      </label>
      <button id="analyze">결과보고서 만들기</button>
    </section>
    <div id="notice" class="notice"></div>
    <section class="summary" aria-label="집계 요약">
      <div class="metric"><span>분석 PDF</span><b id="pdfCount">0</b></div>
      <div class="metric"><span>총 방문건수</span><b id="totalVisits">0</b></div>
      <div class="metric"><span>총 상담인원</span><b id="totalCounseling">0</b></div>
      <div class="metric"><span>처리 상태</span><b id="statusText">대기</b></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>문서 생성 전 미리보기</h2>
        <button id="download" class="secondary" disabled>보고서 다운로드</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>기관명</th><th>파일명</th><th>의사 방문</th><th>의사 상담</th><th>산업위생 방문</th><th>산업위생 상담</th><th>간호사 방문</th><th>간호사 상담</th><th>측정/조치사항</th><th>확인 필요</th></tr></thead>
          <tbody id="rows"><tr><td colspan="10" class="empty">아직 분석한 PDF가 없습니다.</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const files = document.querySelector("#files");
    const analyze = document.querySelector("#analyze");
    const download = document.querySelector("#download");
    const notice = document.querySelector("#notice");
    const rows = document.querySelector("#rows");
    let reportBlob = null;
    let reportFileName = "보건대행기관_업무실적_결과보고서.docx";
    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    function setMetric(id, value) { document.querySelector("#" + id).textContent = value ?? 0; }
    function showNotice(messages) {
      const text = Array.isArray(messages) ? messages.join("\n") : messages;
      notice.textContent = text || "";
      notice.style.display = text ? "block" : "none";
    }
    function base64ToBlob(base64) {
      const bytes = atob(base64);
      const chunks = [];
      for (let i = 0; i < bytes.length; i += 8192) {
        const slice = bytes.slice(i, i + 8192);
        const array = new Uint8Array(slice.length);
        for (let j = 0; j < slice.length; j++) array[j] = slice.charCodeAt(j);
        chunks.push(array);
      }
      return new Blob(chunks, { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    }
    function render(payload) {
      const summary = payload.summary || {};
      setMetric("pdfCount", summary.pdfCount);
      setMetric("totalVisits", summary.totalVisits);
      setMetric("totalCounseling", summary.totalCounseling);
      document.querySelector("#statusText").innerHTML = '<span class="ok">완료</span>';
      const data = payload.rows || [];
      rows.innerHTML = data.length ? data.map((row) => `
        <tr>
          <td>${esc(row.institution)}</td><td>${esc(row.fileName)}</td>
          <td class="num">${esc(row.doctorVisits)}</td><td class="num">${esc(row.doctorCounseling)}</td>
          <td class="num">${esc(row.hygienistVisits)}</td><td class="num">${esc(row.hygienistCounseling)}</td>
          <td class="num">${esc(row.nurseVisits)}</td><td class="num">${esc(row.nurseCounseling)}</td>
          <td>${esc([row.measurements,row.actions,row.materials].filter(Boolean).join(" / "))}</td>
          <td>${esc((row.warnings || []).join(" / "))}</td>
        </tr>`).join("") : '<tr><td colspan="10" class="empty">PDF를 찾지 못했습니다.</td></tr>';
      reportBlob = base64ToBlob(payload.reportBase64 || "");
      reportFileName = payload.reportFileName || reportFileName;
      download.disabled = !payload.reportBase64;
      showNotice(payload.warnings || "");
    }
    analyze.addEventListener("click", async () => {
      if (!files.files.length) { showNotice("분석할 PDF 파일을 선택해 주세요."); return; }
      const form = new FormData();
      for (const file of files.files) form.append("files", file);
      analyze.disabled = true;
      download.disabled = true;
      reportBlob = null;
      document.querySelector("#statusText").textContent = "분석 중";
      showNotice("");
      try {
        const response = await fetch("/api/report", { method:"POST", body:form });
        const raw = await response.text();
        let payload = {};
        try {
          payload = raw ? JSON.parse(raw) : {};
        } catch (parseError) {
          throw new Error(`서버가 JSON이 아닌 응답을 보냈습니다. 상태코드: ${response.status}. 응답 일부: ${raw.slice(0, 200) || "빈 응답"}`);
        }
        if (!raw) {
          throw new Error(`서버 응답이 비어 있습니다. 상태코드: ${response.status}. Netlify Functions 배포 또는 로그를 확인해 주세요.`);
        }
        if (!response.ok) throw new Error(payload.error || "보고서 생성 중 오류가 발생했습니다.");
        render(payload);
      } catch (error) {
        document.querySelector("#statusText").textContent = "오류";
        showNotice(error.message);
      } finally {
        analyze.disabled = false;
      }
    });
    download.addEventListener("click", () => {
      if (!reportBlob) return;
      const url = URL.createObjectURL(reportBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = reportFileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
